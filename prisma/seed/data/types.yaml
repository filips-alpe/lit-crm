# Types derived from the actual Founders Online / Wikidata data (see prisma/seed/pipeline/classifier.ts).
# Each layout maps its fields onto the shared record columns.
- code: letter
  description: Letter or dispatch between correspondents (people or institutions)
  color: '#3b6ea5'
  iconSeed: envelope
  rendererId: letter
  layout:
    fields:
      - { id: title, label: Title, kind: text, writeTo: title }
      - { id: date, label: Date, kind: date, writeTo: date }
      - { id: from, label: From, kind: text, writeTo: from }
      - { id: creator, label: 'From (person)', kind: user, writeTo: creatorId }
      - { id: to, label: To, kind: text, writeTo: to }
      - { id: assignee, label: 'To (person)', kind: user, writeTo: assigneeId }
      - { id: body, label: Text, kind: markdown, writeTo: text }
      - { id: note, label: Note, kind: text, writeTo: note }
      - { id: refs, label: Sources, kind: list, writeTo: references }

