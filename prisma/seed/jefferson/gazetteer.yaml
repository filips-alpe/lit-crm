ambiguous:
  - surface: 'Washington'
    candidates: ['george-washington', 'washington-county', 'city-of-washington']
    reason: 'The bare name is the general, a county named for him, and the federal city.'
  - surface: 'Adams'
    candidates: ['john-adams', 'samuel-adams']
    reason: 'Two different men named Adams are mentioned; the bare surname does not say which.'
  - surface: 'Jefferson'
    candidates: ['thomas-jefferson', 'jefferson-county']
    reason: 'Thomas Jefferson in most parts, but Jefferson county (Kentucky) in the Notes on Virginia tables.'
  - surface: 'Lincoln'
    candidates: ['abraham-lincoln', 'lincoln-county']
    reason: 'Abraham Lincoln in the editorial matter, Lincoln county in the Notes on Virginia and the Logan appendix.'
  - surface: 'Randolph'
    candidates:
      [
        'edmund-randolph',
        'peyton-randolph',
        'thomas-mann-randolph',
        'thomas-jefferson-randolph',
        'isham-randolph',
        'jane-randolph',
      ]
    reason: 'Several Randolphs; only the Autobiography (Peyton) and the Anas (Edmund) are resolved by part.'
  - surface: 'Mr. Randolph'
    candidates: ['edmund-randolph', 'peyton-randolph']
    reason: 'Edmund Randolph in the Anas, Peyton Randolph in the Autobiography; elsewhere unresolved.'
  - surface: 'Lee'
    candidates:
      [
        'richard-henry-lee',
        'francis-lightfoot-lee',
        'thomas-ludwell-lee',
        'arthur-lee',
