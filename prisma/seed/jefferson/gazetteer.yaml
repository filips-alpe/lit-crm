  - surface: 'Henry'
    candidates: ['patrick-henry', 'henry-knox', 'prince-william-henry', 'richard-henry-lee']
    reason: "Patrick Henry, but also a forename of Knox and Lee and part of a prince's name."
  - surface: 'Mr. Henry'
    candidates: ['patrick-henry', 'henry-knox']
