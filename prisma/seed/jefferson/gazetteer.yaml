      ]
    reason: 'At least five Lees are named, often by bare surname.'
  - surface: 'Mr. Lee'
    candidates: ['richard-henry-lee', 'francis-lightfoot-lee', 'arthur-lee']
    reason: 'Three Lees sit in the same Congress; the title does not say which.'
  - surface: 'Morris'
    candidates: ['robert-morris', 'gouverneur-morris', 'lewis-morris']
